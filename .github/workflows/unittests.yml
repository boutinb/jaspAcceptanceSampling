on:
  push:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.cc', '**.h', '**.hpp', '**.stan', '**.qml', 'DESCRIPTION', 'NAMESPACE', 'configure', 'configure.win', 'src/Makevars', 'src/Makevars.win', '.Rbuildignore', '.gitignore', '.gitattributes', '**.yml', 'renv.lock']
  pull_request:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.cc', '**.h', '**.hpp', '**.stan', '**.qml', 'DESCRIPTION', 'NAMESPACE', 'configure', 'configure.win', 'src/Makevars', 'src/Makevars.win', '.Rbuildignore', '.gitignore', '.gitattributes', '**.yml', 'renv.lock']
  schedule:
    - cron: '13 12 * * 1-5'

name: unit-tests

jobs:

  stan-generated:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::renv
      - name: Check that the Stan toolchain dependencies are pinned
        run: Rscript --vanilla tools/check-stan-lockfile.R
      - name: Restore the Stan generation toolchain from renv.lock
        shell: Rscript --vanilla {0}
        run: |
          lock <- renv::lockfile_read("renv.lock")
          dependencies <- unique(c("StanHeaders", "rstantools", "Rcpp", "RcppEigen",
                                   unlist(lock$Packages$rstan$Requirements, use.names = FALSE)))
          renv::restore(library = Sys.getenv("R_LIBS_USER"),
                        packages = intersect(dependencies, names(lock$Packages)),
                        prompt = FALSE)
          # Build rstan against the locked RcppParallel/StanHeaders ABI. A Linux
          # repository binary can target a different TBB runtime despite equal R package versions.
          repositories <- unlist(lock$R$Repositories, use.names = TRUE)
          options(renv.config.ppm.enabled = FALSE, renv.config.install.shortcuts = FALSE)
          # This targeted install does not need the module's unrelated GitHub Remotes.
          renv::install(paste0("rstan@", lock$Packages$rstan$Version), project = tempdir(),
                        library = Sys.getenv("R_LIBS_USER"), repos = repositories,
                        type = "source", rebuild = TRUE, dependencies = FALSE, prompt = FALSE)
      - name: Check generated code before installation can regenerate it
        run: Rscript --vanilla tools/update-stan.R --check
      - name: Exercise stale-file and invalid-source checks
        run: Rscript --vanilla tools/test-stan-build.R

  unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    uses: jasp-stats/jasp-actions/.github/workflows/unittests.yml@v1
    with:
      needs_JAGS: false

